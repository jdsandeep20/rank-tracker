name: Rank Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-rankings:
    name: Google Melbourne rankings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch Melbourne rankings from DataForSEO
        env:
          DFS_LOGIN: ${{ secrets.DFS_LOGIN }}
          DFS_PASSWORD: ${{ secrets.DFS_PASSWORD }}
          TARGET_DOMAIN: melbournelandscape.com.au
          LOCATION_NAME: Melbourne,Victoria,Australia
        run: python rank_tracker.py

      - name: Upload CSV result
        uses: actions/upload-artifact@v4
        with:
          name: melbourne-rankings
          path: results/melbourne_rankings.csv
          if-no-files-found: error

      - name: Save result in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/melbourne_rankings.csv
          git diff --cached --quiet || git commit -m "Update Melbourne rankings"
          git push
